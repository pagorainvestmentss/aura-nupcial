name: Testes (lint + vitest + build)

# Cada PR (e cada push a main) tem de passar lint, testes e build
# antes de poder ser mergeado — é a rede de segurança do projecto.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run lint
      - name: Testes (vitest)
        run: npm test
      - name: Build de produção
        run: npm run build
